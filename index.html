<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secure Cloud Access</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #1e3a8a 0%, #0f172a 45%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 38px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;

      background: linear-gradient(135deg, #2563eb, #06b6d4);
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px 15px;

      border-radius: 12px;
      border: 1px solid #334155;

      background: #0f172a;
      color: white;

      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    input::placeholder {
      color: #64748b;
    }

    .login-btn {
      width: 100%;
      border: none;

      padding: 14px;
      border-radius: 12px;

      background: linear-gradient(135deg, #2563eb, #0891b2);

      color: white;
      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
      margin-top: 8px;

      transition: 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;

      padding: 12px;
      border-radius: 10px;

      font-size: 14px;
      text-align: center;
    }

    .message.error {
      display: block;

      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);

      color: #fca5a5;
    }

    .message.success {
      display: block;

      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);

      color: #86efac;
    }

    .register {
      text-align: center;
      margin-top: 24px;

      color: #94a3b8;
      font-size: 14px;
    }

    .register a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }

    .register a:hover {
      text-decoration: underline;
    }

    .security {
      text-align: center;
      margin-top: 22px;

      color: #64748b;
      font-size: 12px;
    }

    .loading {
      display: inline-block;

      width: 15px;
      height: 15px;

      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;

      vertical-align: middle;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        SC
      </div>

      <h1>Secure Cloud Access</h1>

      <p class="subtitle">
        Secure AWS Cloud Access Management
      </p>

      <form id="loginForm">

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>

        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Sign In
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="register">
        Don't have an account?
        <a href="/register.html">
          Create Account
        </a>
      </div>

      <div class="security">
        🔒 Protected by AWS IAM & Secure Cloud Access
      </div>

    </div>

  </div>

  <script>

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;
    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const username =
          document
            .getElementById("username")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!username || !password) {

          showMessage(
            "Please enter username and password.",
            "error"
          );

          return;
        }


        loginBtn.disabled = true;

        loginBtn.innerHTML =
          '<span class="loading"></span>Signing In...';


        try {

          const response =
            await fetch("/login", {

              method: "POST",

              credentials: "same-origin",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                username: username,
                password: password
              })

            });


          const data =
            await response.json();


          console.log(
            "LOGIN RESPONSE:",
            data
          );


          if (!response.ok || !data.success) {

            showMessage(
              data.message ||
              "Login failed.",
              "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
              "Sign In";

            return;
          }


          showMessage(
            "Login successful. Opening dashboard...",
            "success"
          );


          /*
            IMPORTANT:
            Go directly to dashboard after
            successful login.
          */

          window.location.assign(
            "/dashboard.html"
          );

        }

        catch(error) {

          console.error(
            "LOGIN ERROR:",
            error
          );

          showMessage(
            "Unable to connect to server.",
            "error"
          );

          loginBtn.disabled = false;

          loginBtn.textContent =
            "Sign In";
        }

      }
    );

  </script>

</body>
</html>
